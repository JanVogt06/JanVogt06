<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, description, preview image and languages, filled in by the
         site plugin in vite.config.ts for each language. -->
    <!--site:head-->
    <meta name="theme-color" content="#8fbbe6" />
    <link rel="icon" type="image/png" href="/src/images/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* The splash lives here so it shows before any script arrives. */
      .loader {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: linear-gradient(#8fbbe6, #fbe6c6 70%);
        color: #27304a;
        font-family: ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
        text-align: center;
        transition: opacity 0.6s ease;
      }
      .loader.done {
        opacity: 0;
        pointer-events: none;
      }
      .loader-rover {
        width: 150px;
        height: auto;
        animation: loader-bob 1.6s ease-in-out infinite;
      }
      .loader-name {
        margin: 0;
        font-size: 24px;
        font-weight: 800;
      }
      .loader-text {
        max-width: 300px;
        margin: 0;
        color: rgb(39 48 74 / 0.75);
        font-size: 14px;
        line-height: 1.5;
      }
      .loader-text.failed {
        color: #a3392a;
      }
      @keyframes loader-bob {
        50% {
          transform: translateY(-8px) rotate(-2deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-rover {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="loader" class="loader" role="status" aria-live="polite">
      <img class="loader-rover" src="/src/images/rover.webp" alt="" width="150" height="142" />
      <p class="loader-name">Jan Vogt</p>
      <p class="loader-text"><!--site:loading--></p>
    </div>
    <script>
      // Anything that goes wrong before the page's own screens are up ends
      // up here, instead of leaving an empty page.
      function failed() {
        var loader = document.getElementById('loader')
        if (!loader) return
        var text = loader.querySelector('.loader-text')
        text.textContent =
          'Die Seite konnte nicht geladen werden. Bitte lade sie neu.'
        text.classList.add('failed')
      }
      addEventListener('error', failed)
      addEventListener('unhandledrejection', failed)
    </script>
    <canvas id="world"></canvas>
    <!-- The text page, written in by the build for search engines and for
         readers without JavaScript; the page replaces it on start. -->
    <div id="ui"><!--site:text--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
